name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --lib --bin terra -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p terra-prepare -- --check
      - run: trunk build --release --cargo-profile web
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: uv run --locked --group browser tools/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
