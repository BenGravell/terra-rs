[package]
name = "terra-prepare"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "terra-prepare"
path = "main.rs"

[dependencies]
terra = { path = "../..", default-features = false }
polars = { version = "0.55.1", default-features = false, features = ["lazy"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
earcutr = "0.4"

